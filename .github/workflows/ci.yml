name: ci

on:
  push:
    branches: [main, "gsd/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref on a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Phase 5 / Plan 05-03: full test suite under default features,
  # validation-enabled features, and the vulkan-goldens cross-backend
  # mirror. Runs on Windows and Ubuntu.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Vulkan validation layers (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            vulkan-validationlayers \
            mesa-vulkan-drivers \
            vulkan-tools

      # Windows runners ship with a Mesa software Vulkan ICD; Vulkan
      # SDK is not pre-installed. If a future iteration needs
      # VK_LAYER_KHR_validation on Windows, add a hunspelljr/vulkan-validation@v1
      # step here; deferred for now per plan 05-03 Task 3.

      - name: Default feature build (sanity)
        run: cargo build --lib --tests

      - name: Default feature test
        run: cargo test --lib --tests

      # Plan 05-03 (REND-03): validation-enabled test run. Surfaces
      # buffer-alignment, push-constants, and other validation issues
      # the default release path silently allows.
      - name: Validation layers test
        run: cargo test --lib --tests --features validation-layers

      # Plan 05-01 (REND-01): cross-backend visual goldens under
      # Vulkan. The 8 scenes + 1 aggregate test compare against the
      # PRIMARY-captured baselines.
      - name: Vulkan cross-backend goldens
        run: cargo test --features vulkan-goldens --test visual_goldens_vulkan
        env:
          # Force the Mesa software ICD on Windows runners (Vulkan
          # SDK not installed) so the test does not require a
          # hardware GPU.
          VK_ICD_FILENAMES: ${{ matrix.os == 'windows-latest' && 'C:\Windows\System32\ vulkaninfo.json' || '' }}

  # Plan 05-03: lint job. Runs on Ubuntu (faster CI cycle, no need
  # for Windows for a lint pass). `cargo clippy --all-targets
  # --all-features -- -D warnings` fails the build on any warning,
  # including the validation-layers-gated code paths.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo clippy (all targets, all features, deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # Plan 05-03: doc job. Enforces the public API is documented.
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo doc (private items documented)
        run: cargo doc --no-deps --document-private-items
