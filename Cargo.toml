[package]
name = "rgui"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
image = "0.25"
kurbo = "0.11"
pollster = "0.4"
quick-xml = { version = "0.37", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taffy = "0.10.1"
thiserror = "2"
glyphon = "0.11.0"
wgpu = "29"
winit = "0.30"
arboard = "3.4.0"

[features]
default = ["text", "images", "accessibility", "debug"]
text = []
images = []
svg = []
accessibility = []
accesskit = []
serde = []
debug = []
html = []
rml = ["dep:quick-xml"]
tailwind = []
css = []
canvas = []
bitmap-text-fallback = []
# Plan 05-01 (REND-01): gates `tests/visual_goldens_vulkan.rs`, the
# cross-backend visual-golden mirror. Off by default because not every
# developer's machine has a working Vulkan ICD; CI (plan 05-03) enables
# it on `windows-latest` + `ubuntu-latest` runners.
vulkan-goldens = []
# Plan 05-03 (REND-03): enables wgpu validation layers (Vulkan:
# VK_LAYER_KHR_validation, Metal: Metal Validation, DX12: D3D12 Debug
# Layer) by setting `wgpu::InstanceFlags::VALIDATION` on every
# `InstanceDescriptor`. Imposes a 2-5x render time cost. Used in CI to
# surface buffer-alignment, push-constants, and other validation issues
# that the default release path silently allows. Not for production.
validation-layers = []

[[example]]
name = "rml_showcase"
required-features = ["rml"]

[[example]]
name = "rml_widget_gallery"
required-features = ["rml"]
